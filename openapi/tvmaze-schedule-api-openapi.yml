openapi: 3.0.0
info:
  title: TVmaze Premium User auth Schedule API
  description: 'Premium-only user API for TVmaze. Access is restricted to users with a paid

    [Premium subscription](https://www.tvmaze.com/premium). A user can only access

    their own data.


    Authentication uses HTTP Basic: the TVmaze username is the basic-auth username and

    the API key (visible on the user dashboard) is the basic-auth password. There is

    also a device-style auth-pairing flow exposed at `/auth/start` and `/auth/poll`.

    '
  version: '1.0'
  contact:
    name: TVmaze
    url: https://www.tvmaze.com
  license:
    name: CC BY-SA 4.0
    url: https://creativecommons.org/licenses/by-sa/4.0/
servers:
- url: https://api.tvmaze.com/v1
- url: http://api.tvmaze.com/v1
security:
- usertoken: []
tags:
- name: Schedule
  description: Daily and rolling TV and web/streaming schedules.
paths:
  /schedule:
    get:
      tags:
      - Schedule
      operationId: getSchedule
      summary: Get Schedule
      description: Return the TV schedule for a country on a given date.
      parameters:
      - name: country
        in: query
        required: false
        schema:
          type: string
        description: ISO 3166-1 alpha-2 country code (default US).
      - name: date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: ISO 8601 date (default today).
      responses:
        '200':
          description: Array of scheduled episodes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Episode'
              examples:
                default:
